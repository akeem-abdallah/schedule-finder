name: Course Refresh

# started every 15 minutes by an external cron-job.org job through the GitHub API,
# because GitHub's own schedule trigger ran hours late; no schedule trigger here
# also means GitHub can't auto-disable this workflow after 60 days without commits
on:
  workflow_dispatch:

# never run two refreshes at once; a new trigger waits for the current run
concurrency:
  group: course-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: python fetch_schedule.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
